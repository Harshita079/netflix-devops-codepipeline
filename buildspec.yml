version: 0.2

phases:
  install:
    commands:
      - echo "Updating packages"
      - apt-get update -y
      - apt-get install -y unzip curl

      - echo "Installing Terraform"
      - curl -L -o terraform.zip https://releases.hashicorp.com/terraform/1.6.6/terraform_1.6.6_linux_amd64.zip
      - ls -l
      - unzip terraform.zip
      - mv terraform /usr/local/bin/
      - terraform -version

  pre_build:
    commands:
      - echo "Initializing Terraform"
      - cd terraform
      - terraform init

  build:
    commands:
      - echo "Applying Terraform (Creating EC2)"
      - terraform apply -auto-approve
      - cd ..

      - echo "Building Docker image"
      - docker build -t netflix-app .

  post_build:
    commands:
      - echo "Fetching EC2 Public IP"
      - cd terraform
      - terraform output -raw instance_public_ip > ip.txt
      - cat ip.txt

artifacts:
  files:
    - '**/*'