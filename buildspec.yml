version: 0.2

phases:
  install:
    commands:
      - echo Installing Terraform
      - apt-get update -y
      - apt-get install -y unzip curl
      - curl -O https://releases.hashicorp.com/terraform/1.6.6/terraform_1.6.6_linux_amd64.zip
      - unzip terraform_1.6.6_linux_amd64.zip
      - mv terraform /usr/local/bin/
      - terraform -version

  pre_build:
    commands:
      - echo Terraform Init
      - cd terraform
      - terraform init

  build:
    commands:
      - echo Terraform Apply
      - terraform apply -auto-approve
      - cd ..
      - echo Build Docker Image
      - docker build -t netflix-app .

  post_build:
    commands:
      - echo Getting EC2 IP
      - cd terraform
      - terraform output -raw instance_public_ip > ip.txt
      - cat ip.txt